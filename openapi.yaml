      - Profile
      summary: Get a user's public profile by username
      description: "PURPOSE: Resolve a username to a profile (same data as GET /profiles/{userId}).\n\
        CONCEPTS: Profiling, Following, Posting, Subscribing, Liking, Commenting,\n\
        \  ModerationReview (content-visibility gate).\nACTIONS: Calls Profiling._getProfileByUsername(username),\
        \ then the same\n  hydration pipeline as GET /profiles/{userId} using the\
        \ resolved userId.\n  Moderation gate: excludes posts whose ModerationReview\
        \ status is \"pending\",\n  \"flagged\", or \"admin_removed\" — only \"approved\"\
        \ and \"admin_approved\"\n  posts are visible.\nSIDE EFFECTS: None.\nPREREQUISITES:\
        \ Valid bearer access token.\nRESPONSE: { profile, followerCount, followingCount,\
        \ isFollowing, posts }.\nERRORS: 404 \"user not found\" when no profile has\
        \ the given username.\n"
      parameters:
      - name: username
        in: path
