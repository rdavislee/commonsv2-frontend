  /profiles/search:
    get:
      tags:
      - Profile
      summary: Search users by display name or username
      description: "PURPOSE: Find users to follow.\nCONCEPTS: Profiling.\nACTIONS:\
        \ Calls Profiling._searchProfiles(query) → case-insensitive\n  partial match\
        \ on username OR name.\nSIDE EFFECTS: None.\nPREREQUISITES: Valid bearer access\
        \ token.\nRESPONSE: { profiles: [Profile, ...] } ordered by relevance/match.\n\
        ERRORS: 400 when query is empty or too long.\n"
      parameters:
      - name: query
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 60
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 30
      responses:
        '200':
          description: Matching profiles
          content:
            application/json:
              schema:
                type: object
                required:
                - profiles
                properties:
                  profiles:
                    type: array
                    items:
                      $ref: '#/components/schemas/Profile'
  /media/upload:
    post:
      tags:
      - Media
      summary: Upload an image file (avatar or post photo)
      description: "PURPOSE: Upload a file and return its canonical URL.\nCONCEPTS:\
        \ MediaHosting.\nACTIONS: Calls MediaHosting.upload(uploader=user, fileData,\
        \ mimeType,\n  fileName, accessPolicy=\"public\").\nSIDE EFFECTS: Stores bytes\
        \ in chunked storage and writes a MediaFile\n  metadata row; returns a canonical\
        \ /media/{id} URL.\nPREREQUISITES: Valid bearer access token. File ≤200MB.\
        \ MIME type must be\n  supported (image/*, video/*, audio/*, text/*, plus\
        \ the explicit allow-set\n  in the concept). For this app use image/* — avatars\
        \ and post photos.\nRESPONSE: { media: Media } — pass the returned `url` as\
        \ bioImageUrl on\n  POST /me/profile or as imageUrl (inside content) on POST\
        \ /posts.\nERRORS: 400 \"file too large\"; 400 \"unsupported mime type\";\n\
        \  400 \"empty file\".\n"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              - mimeType
              properties:
                file:
                  type: string
                  format: binary
                  description: Image bytes (any image/* mime)
                mimeType:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: MIME type matching the uploaded file
                fileName:
                  type: string
                  maxLength: 255
                  description: Optional original filename
      responses:
        '201':
          description: File uploaded
          content:
            application/json:
              schema:
                type: object
                required:
                - media
                properties:
                  media:
                    $ref: '#/components/schemas/Media'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /posts:
    post:
      tags:
      - Posts
      summary: Create a new post (with AI moderation screening)
      description: "PURPOSE: Create a post with a previously-uploaded photo and caption,\n\
        \  optionally marked supporters-only. The post is screened by automated AI\n\
        \  moderation before becoming visible in feeds.\nCONCEPTS: Posting, Feed (side-effect\
        \ fan-out), Following (queried for fan-out),\n  ModerationReview, AIModeration.\n\
        ACTIONS:\n  1. Posting.createPost(author=user, content={caption, imageUrl,\
        \ supportersOnly}, type=\"image\")\n  2. ModerationReview.record(targetType=\"\
        post\", targetId=postId, authorId=user) → reviewId\n  3. Resolve the platform\
        \ moderation policy:\n     - AIModeration._listPoliciesForOwner(systemOwner)\
        \ → check for existing policy\n     - If none exists: AIModeration.createPolicy(owner=systemOwner,\
        \ name=\"Community Guidelines\",\n       policyText=<community guidelines\
        \ text describing harassment, hate, sexually explicit material, spam>)\n \
        \    - Use the resolved policyId\n  4. AIModeration.moderate(policy=policyId,\
        \ item=postId, content={caption, imageUrl})\n     → returns { moderationResultId,\
        \ verdict } or { error }\n  5. If error: post stays moderationStatus=\"pending\"\
        \ (AI moderation failed —\n     post remains hidden until retried or admin\
        \ review)\n  6. If verdict=true (approved):\n     - ModerationReview.applyVerdict(review=reviewId,\
        \ status=\"approved\")\n     - Following._following(user) → list of follower\
        \ userIds\n     - For each follower: Feed.fanoutEntry([follower], user, postId,\
        \ now,\n       {caption, imageUrl, supportersOnly, authorId:user})\n  7. If\
        \ verdict=false (flagged):\n     - AIModeration._getModerationResult(moderationResultId)\
        \ → get rationale\n     - ModerationReview.applyVerdict(review=reviewId, status=\"\
        flagged\",\n       ruleViolated=<extracted from rationale>, rationale=<AI\
        \ written explanation>)\n     - Do NOT fan out to feeds (post is hidden from\
        \ all feeds)\nAI PROMPTING CONTRACT: The moderation policy text must instruct\
        \ the AI to\n  screen the submitted text content (caption) against four community\
        \ guidelines:\n  harassment, hate, sexually_explicit, spam. The AI must return\
        \ verdict=true\n  if the content passes (no violation) or verdict=false if\
        \ it violates any\n  rule. The AI's rationale must clearly name which of the\
        \ four rules was\n  violated so the sync can extract the ruleViolated value.\
        \ The content object\n  passed to moderate is {caption, imageUrl} — the AI\
        \ analyzes the caption text;\n  imageUrl is included for context but the AI\
        \ primarily screens text.\nSIDE EFFECTS: ModerationReview row created; if\
        \ approved, post fans out to all\n  followers' Home Feeds; if flagged, post\
        \ is hidden from feeds.\nPREREQUISITES: Valid bearer access token. imageUrl\
        \ must be a URL\n  returned from POST /media/upload.\nRESPONSE: { post: Post\
        \ } with moderationStatus set to \"approved\",\n  \"flagged\", or \"pending\"\
        \ depending on AI verdict. isLocked=false,\n  isLiked=false, likeCount=0,\
        \ commentCount=0, isOwner=true.\n  If moderationStatus is \"flagged\", moderationRuleViolated\
        \ indicates which\n  community guideline was broken.\nERRORS: 400 \"caption\
        \ required\"; 400 \"imageUrl required\";\n  400 \"imageUrl must be a media\
        \ URL\"; 400 \"supportersOnly must be boolean\".\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - caption
              - imageUrl
              properties:
                caption:
                  type: string
                  minLength: 1
                  maxLength: 2000
                imageUrl:
                  type: string
                  maxLength: 2048
                  description: URL returned by POST /media/upload
                supportersOnly:
                  type: boolean
                  default: false
                  description: When true, non-supporters see a locked placeholder
                    for the image.
      responses:
        '201':
          description: Post created (moderation status reflects AI screening result)
          content:
            application/json:
              schema:
                type: object
                required:
                - post
                properties:
                  post:
                    $ref: '#/components/schemas/Post'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /posts/{postId}:
    get:
      tags:
      - Posts
      summary: Get a single post with comments, like state, and moderation status
      description: "PURPOSE: View a post's detail page.\nCONCEPTS: Posting, Commenting,\
        \ Liking, Subscribing, Profiling, Following,\n  ModerationReview (content-visibility\
        \ gate).\nACTIONS:\n  1. Posting._getPost(postId)\n  2. ModerationReview._getLatestForTarget(\"\
        post\", postId) → moderation status\n  3. VISIBILITY LOGIC:\n     - If moderationStatus\
        \ is \"approved\" or \"admin_approved\": visible to all\n     - If moderationStatus\
        \ is \"pending\" or \"flagged\": visible ONLY to the\n       author (show\
        \ pending/blocked message with ruleViolated). If viewer is\n       NOT the\
        \ author → return 404 (not accessible)\n     - If moderationStatus is \"admin_removed\"\
        : return 404 for everyone\n  4. If authorId is null (anonymized): render \"\
        [deleted]\" — author = null\n  5. Subscribing._hasActiveAccess(viewer) → gate\n\
        \  6. If supportersOnly AND not hasActiveAccess AND viewer is not the author:\n\
        \     imageUrl is nulled out and isLocked=true (caption + comments remain\
        \ visible)\n  7. Liking._isLiked(postId, viewer) → isLiked\n  8. Liking._countForItem(postId)\
        \ → likeCount\n  9. Commenting._getComments(postId) → comments (newest first)\n\
        \ 10. For each comment: ModerationReview._getLatestForTarget(\"comment\",\
        \ commentId)\n      → filter: only show \"approved\" and \"admin_approved\"\
        \ comments to non-authors.\n      Show \"flagged\" and \"pending\" comments\
        \ only to the comment's author.\n      Exclude \"admin_removed\" comments\
        \ entirely.\n  11. Profiling._getProfile(authorId) → author\n  12. Profiling._getProfilesByIds(comment.authorIds)\
        \ → comment authors\nSIDE EFFECTS: None.\nPREREQUISITES: Valid bearer access\
        \ token.\nRESPONSE: { post, comments }.\n  - post.moderationStatus and post.moderationRuleViolated\
        \ are always set\n  - comments only include moderation-approved ones for non-authors;\n\
        \    comment authors see their own flagged/pending comments with\n    moderationRuleViolated\
        \ shown\nERRORS: 404 \"post not found\" (covers both missing post and\n  non-author\
        \ viewing blocked/pending/admin_removed content).\n"
      parameters:
      - name: postId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Post found
          content:
            application/json:
              schema:
                type: object
                required:
                - post
                - comments
                properties:
                  post:
                    $ref: '#/components/schemas/Post'
                  comments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Comment'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
      - Posts
      summary: Delete own post with full cascade
      description: "PURPOSE: Delete own post and all derived data.\nCONCEPTS: Posting,\
        \ Commenting, Liking, Notifying, Feed, MediaHosting,\n  ModerationReview,\
        \ AIModeration.\nACTIONS (server-side, in order; each step is idempotent):\n\
        \  1. Posting._getPost(postId) → verify authorId == session user (else 403)\n\
        \  2. Posting.deletePost(postId, author=user)\n  3. Commenting.deleteByItem(postId)\
        \ — drop comments\n  4. Liking.deleteByItem(postId) — drop likes\n  5. Notifying.deleteByTrigger(postId)\
        \ — drop notifications triggered by this post\n  6. Feed.removeItem(postId)\
        \ — drop from every viewer's feed\n  7. ModerationReview.deleteByTarget(\"\
        post\", postId) — drop moderation review\n  8. MediaHosting.delete(imageId,\
        \ user) — free storage (best-effort)\nSIDE EFFECTS: All derived data for this\
        \ post is removed, including its\n  ModerationReview row.\nPREREQUISITES:\
        \ Valid bearer access token. The post must be authored by\n  the current user.\n\
        RESPONSE: { ok: true }\nERRORS: 403 \"not your post\"; 404 \"post not found\"\
        .\n"
      parameters:
      - name: postId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Post deleted
          content:
            application/json:
              schema:
                type: object
                required:
                - ok
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
        '403':
          description: Not your post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /feed/home:
    get:
      tags:
      - Feed
      summary: Home feed — posts from followed users (moderation-approved only)
      description: "PURPOSE: Render the Home Feed (default landing for logged-in users).\n\
        CONCEPTS: Feed, Subscribing, Profiling, Liking, Commenting, Following,\n \
        \ ModerationReview (content-visibility gate — posts are only fanned out on\n\
        \ approval, so the materialized feed inherently excludes flagged/pending content).\n\
        ACTIONS:\n  1. Feed._getFeed(viewer, limit, before) → entries (newest first)\n\
        \  2. Subscribing._hasActiveAccess(viewer) → gate\n  3. For each entry, if\
        \ payload.supportersOnly AND !hasActiveAccess:\n     imageUrl is nulled and\
        \ isLocked=true (owner still sees in full).\n  4. ModerationReview._getLatestForTarget(\"\
        post\", postId) for each entry → resolve\n     moderationStatus and moderationRuleViolated.\
        \ Posts in the feed should already\n     be approved (fan-out only happens\
        \ on approval), but the status is included\n     for completeness.\n  5. Profiling._getProfilesByIds([entry.source\
        \ for each entry]) → author batch\n  6. Liking._likedAmong([entry.item], viewer)\
        \ → isLiked per post\n  7. Liking._countForItems([entry.item]) → likeCount\
        \ per post\n  8. Commenting._getCommentsByItems([entry.item]) → groups; commentCount\
        \ = length\nSIDE EFFECTS: None.\nPREREQUISITES: Valid bearer access token.\n\
        RESPONSE: { posts: [Post, ...], nextCursor } — newest-first paginated.\n \
        \ Each post includes moderationStatus (expected to be \"approved\" or\n  \"\
        admin_approved\"). Empty array means the user follows no one\n  (frontend\
        \ shows a \"Visit Discover\" empty state).\nERRORS: 401 invalid session.\n"
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: before
        in: query
        schema:
          type: string
          format: date-time
          description: Cursor — return entries strictly older than this createdAt
      responses:
        '200':
          description: Home feed entries
          content:
            application/json:
              schema:
                type: object
                required:
                - posts
                properties:
                  posts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Post'
                  nextCursor:
                    type: string
                    format: date-time
                    nullable: true
                    description: Pass as `before` for the next page. null when no
                      more entries.
  /feed/discover:
    get:
      tags:
      - Feed
      summary: Discover feed — recent approved posts from ALL users
      description: "PURPOSE: Render the Discover Feed.\nCONCEPTS: Posting, Subscribing,\
        \ Profiling, Liking, Commenting,\n  ModerationReview (content-visibility gate\
        \ — excludes non-approved posts).\nACTIONS:\n  1. Posting._allPosts(limit,\
        \ skip) → posts (newest first; includes anonymized)\n  2. For each post: ModerationReview._getLatestForTarget(\"\
        post\", postId)\n     → EXCLUDE posts whose moderationStatus is \"pending\"\
        , \"flagged\", or\n     \"admin_removed\". Only \"approved\" and \"admin_approved\"\
        \ posts appear.\n  3. Subscribing._hasActiveAccess(viewer) → gate\n  4. Apply\
        \ supporters-only gating for non-supporters (image nulled + isLocked=true).\n\
        \     Anonymized posts (authorId == null) render with author=null.\n  5. Profiling._getProfilesByIds([post.authorId\
        \ for non-null]) → authors\n  6. Liking._likedAmong([post._id], viewer) →\
        \ isLiked\n  7. Liking._countForItems([post._id]) → likeCount\n  8. Commenting._getCommentsByItems([post._id])\
        \ → groups; commentCount = length\nSIDE EFFECTS: None.\nPREREQUISITES: Valid\
        \ bearer access token.\nRESPONSE: { posts: [Post, ...], nextCursor } — newest-first\
        \ paginated\n  by offset (skip). nextCursor is an integer (next skip) or null\
        \ when exhausted.\n  Only moderation-approved posts are included.\nERRORS:\
        \ 401 invalid session.\n"
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: skip
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: Discover posts
          content:
            application/json:
              schema:
                type: object
                required:
                - posts
                properties:
                  posts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Post'
                  nextCursor:
                    type: integer
                    nullable: true
                    description: Next skip value, or null when no more posts.
  /me/posts:
    get:
      tags:
      - Posts
      summary: Get own posts with moderation status indicators (My Posts list)
      description: "PURPOSE: List current user's own posts including ALL moderation\
        \ statuses\n  (approved, pending, flagged, admin_approved) with visual status\
        \ indicators.\n  No supporters-only gating — owner always sees in full.\n\
        CONCEPTS: Posting, Liking, Commenting, Profiling, ModerationReview.\nACTIONS:\n\
        \  1. Posting._getPostsByAuthor(user, limit, skip)\n  2. For each post: ModerationReview._getLatestForTarget(\"\
        post\", postId)\n     → resolve moderationStatus and moderationRuleViolated\n\
        \  3. Liking._likedAmong + Liking._countForItems (always true, always 1 author)\n\
        \  4. Commenting._getCommentsByItems → commentCount per post\nSIDE EFFECTS:\
        \ None.\nPREREQUISITES: Valid bearer access token.\nRESPONSE: { posts: [Post,\
        \ ...], nextCursor }.\n  Each post includes moderationStatus and moderationRuleViolated\
        \ so the\n  frontend can show status badges (approved, pending, blocked) and\
        \ which\n  community guideline was violated for flagged posts.\nERRORS: 401\
        \ invalid session.\n"
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 30
      - name: skip
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: Own posts
          content:
            application/json:
              schema:
                type: object
                required:
                - posts
                properties:
                  posts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Post'
                  nextCursor:
                    type: integer
                    nullable: true
  /users/{userId}/posts:
    get:
      tags:
      - Posts
      summary: Get a specific user's posts (moderation-approved only for non-authors)
      description: "PURPOSE: List another user's posts (respects supporters-only gating\n\
        \  unless the viewer is the author). Only moderation-approved posts are\n\
        \  visible to non-authors.\nCONCEPTS: Posting, Liking, Commenting, Profiling,\
        \ Subscribing,\n  ModerationReview (content-visibility gate).\nACTIONS: Same\
        \ as /feed/discover but scoped to a single author via\n  Posting._getPostsByAuthor(userId,\
        \ limit, skip).\n  Moderation gate: For each post, ModerationReview._getLatestForTarget(\"\
        post\", postId)\n  → exclude posts whose status is \"pending\", \"flagged\"\
        , or \"admin_removed\".\n  Only \"approved\" and \"admin_approved\" posts\
        \ are included for non-authors.\n  If viewer IS the author, all statuses are\
        \ shown (same as GET /me/posts).\nSIDE EFFECTS: None.\nPREREQUISITES: Valid\
        \ bearer access token.\nRESPONSE: { posts: [Post, ...], nextCursor }.\nERRORS:\
        \ 401 invalid session.\n"
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 30
      - name: skip
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: User's posts
          content:
            application/json:
              schema:
                type: object
                required:
                - posts
                properties:
                  posts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Post'
                  nextCursor:
                    type: integer
                    nullable: true
  /posts/{postId}/comments:
    get:
      tags:
      - Comments
      summary: List comments on a post (moderation-approved only, except author's
        own)
      description: "PURPOSE: Load comments for the post detail page.\nCONCEPTS: Commenting,\
        \ Profiling, ModerationReview (content-visibility gate).\nACTIONS:\n  1. Commenting._getComments(postId)\
        \ → comments (newest first; includes anonymized with author=null)\n  2. For\
        \ each comment: ModerationReview._getLatestForTarget(\"comment\", commentId)\n\
        \     → resolve moderationStatus and moderationRuleViolated\n  3. FILTER:\
        \ Only include comments whose moderationStatus is \"approved\" or\n     \"\
        admin_approved\". Additionally, if the current viewer is the author of a\n\
        \     comment with status \"pending\" or \"flagged\", include that comment\
        \ too\n     (so the author sees their own blocked content with the violation\
        \ message).\n     Exclude \"admin_removed\" comments entirely.\n  4. Profiling._getProfilesByIds([authorId\
        \ for each non-null]) → author batch\nSIDE EFFECTS: None.\nPREREQUISITES:\
        \ Valid bearer access token.\nRESPONSE: { comments: [Comment, ...] }.\n  Each\
        \ comment includes moderationStatus and moderationRuleViolated. Non-author\n\
        \  viewers only see approved/admin_approved comments. Comment authors see\n\
        \  their own flagged/pending comments with the violated rule indicated.\n\
        ERRORS: 404 \"post not found\".\n"
      parameters:
      - name: postId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Comments
          content:
            application/json:
              schema:
                type: object
                required:
                - comments
                properties:
                  comments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Comment'
    post:
      tags:
      - Comments
      summary: Post a comment on a post (with AI moderation screening)
      description: "PURPOSE: Add a comment and notify the post author. The comment\
        \ is screened\n  by automated AI moderation before becoming publicly visible.\n\
        CONCEPTS: Commenting, Notifying, Posting (for author lookup),\n  ModerationReview,\
        \ AIModeration.\nACTIONS:\n  1. Posting._getPost(postId) → resolve post.authorId\n\
        \  2. Commenting.postComment(item=postId, author=user, content=text) → commentId\n\
        \  3. ModerationReview.record(targetType=\"comment\", targetId=commentId,\
        \ authorId=user)\n     → reviewId\n  4. Resolve the platform moderation policy\
        \ (same as POST /posts)\n  5. AIModeration.moderate(policy=policyId, item=commentId,\
        \ content={text})\n     → returns { moderationResultId, verdict } or { error\
        \ }\n  6. If error: comment stays moderationStatus=\"pending\"\n  7. If verdict=true\
        \ (approved):\n     - ModerationReview.applyVerdict(review=reviewId, status=\"\
        approved\")\n     - If post.authorId != user: Notifying.notify(recipient=post.authorId,\n\
        \       trigger=postId, content={type:\"comment\", actorId:user, commentId,\
        \ commentText},\n       type=\"comment\")\n  8. If verdict=false (flagged):\n\
        \     - AIModeration._getModerationResult(moderationResultId) → rationale\n\
        \     - ModerationReview.applyVerdict(review=reviewId, status=\"flagged\"\
        ,\n       ruleViolated=<extracted from rationale>, rationale=<AI explanation>)\n\
        \     - Do NOT notify the post author (comment is hidden)\nAI PROMPTING CONTRACT:\
        \ The moderation policy text must instruct the AI to\n  screen the comment\
        \ text against four community guidelines: harassment,\n  hate, sexually_explicit,\
        \ spam. The AI must return verdict=true if the text\n  passes or verdict=false\
        \ if it violates any rule. The rationale must name\n  the violated rule so\
        \ the sync can extract the ruleViolated value.\nSIDE EFFECTS: Comment created;\
        \ ModerationReview row created. If approved, post\n  author gets a notification.\
        \ If flagged, comment is hidden from public view.\nPREREQUISITES: Valid bearer\
        \ access token. Supporters-only gating does\n  NOT block commenting (only\
        \ viewing the image).\nRESPONSE: { comment: Comment } with author hydrated\
        \ and moderationStatus set\n  to \"approved\", \"flagged\", or \"pending\"\
        . If flagged, moderationRuleViolated\n  indicates which community guideline\
        \ was broken.\nERRORS: 400 \"text required\"; 400 \"text too long\";\n  404\
        \ \"post not found\".\n"
      parameters:
      - name: postId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - text
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 1000
      responses:
        '201':
          description: Comment created (moderation status reflects AI screening result)
          content:
            application/json:
              schema:
                type: object
                required:
                - comment
                properties:
                  comment:
                    $ref: '#/components/schemas/Comment'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /comments/{commentId}:
    patch:
      tags:
      - Comments
      summary: Edit own comment
      description: "PURPOSE: Edit comment text.\nCONCEPTS: Commenting.\nACTIONS:\n\
        \  1. Commenting._getComment(commentId) → verify author == user (else 403)\n\
        \  2. Commenting.editComment(commentId, author=user, content=text)\nSIDE EFFECTS:\
        \ Comment content + updatedAt updated.\nPREREQUISITES: Valid bearer access\
        \ token. Must be the comment author.\nRESPONSE: { comment: Comment }.\nERRORS:\
        \ 400 \"text required\"; 400 \"text too long\";\n  403 \"not your comment\"\
        ; 404 \"comment not found\".\n"
      parameters:
      - name: commentId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
