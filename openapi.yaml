      summary: Start a Stripe Checkout session (Become a Supporter)
      description: "PURPOSE: Begin the supporter subscription flow.\nCONCEPTS: Subscribing.\n\
        ACTIONS: Calls Subscribing.startCheckout(owner=user, priceId,\n  successUrl,\
        \ cancelUrl) — generates a hosted Checkout Session URL.\n  Server uses STRIPE_PRICE_ID\
        \ from env if priceId not provided.\nSIDE EFFECTS: A placeholder Subscription\
        \ row is created with status=\"pending\",\n  keyed by the sessionId. The frontend\
        \ must FULL-PAGE redirect the\n  browser to `url` (do not use fetch — Stripe\
        \ needs the navigation).\nPREREQUISITES: Valid bearer access token.\nRESPONSE:\
        \ { sessionId, url } — frontend redirects to `url`.\nERRORS: 400 \"price not\
        \ configured\"; 502 \"stripe error\".\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                successUrl:
                  type: string
                  maxLength: 2048
                  description: Optional override for where Stripe redirects on success
                    (carries ?session_id=...)
                cancelUrl:
                  type: string
                  maxLength: 2048
                  description: Optional override for where Stripe redirects on cancel
      responses:
        '200':
          description: Checkout session created
          content:
            application/json:
              schema:
                type: object
                required:
                - sessionId
                - url
                properties:
                  sessionId:
                    type: string
                  url:
                    type: string
                    description: Stripe-hosted Checkout URL — frontend must full-page
                      redirect
  /subscription/verify:
    post:
      tags:
      - Subscription
      summary: Verify a Stripe Checkout session on return from the hosted page
      description: "PURPOSE: Dual-signal — confirm checkout completion after the user\n\
        \  lands back on the success URL.\nCONCEPTS: Subscribing.\nACTIONS: Calls\
        \ Subscribing.verifySession(sessionId) — retrieves the\n  session server-side\
        \ and applies the lifecycle status (merge-upsert\n  with the webhook path).\
        \ Returns the resulting status and `applied`\n  (true only when THIS call\
        \ changed local state; false when the\n  webhook already won the race).\n\
        SIDE EFFECTS: Subscription row updated; on `applied=true`, supporter\n  access\
        \ is granted (status=\"active\" or \"trialing\") OR revoked if\n  the session\
        \ was a renewal-cancel that landed.\nPREREQUISITES: Valid bearer access token.\
        \ `sessionId` comes from\n  the `?session_id=` query param Stripe appends\
        \ to the success URL.\nRESPONSE: { status, active, applied }\nERRORS: 400\
        \ \"session not found\".\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - sessionId
              properties:
                sessionId:
                  type: string
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - active
                - applied
                properties:
                  status:
                    type: string
                    enum:
                    - active
                    - trialing
                    - past_due
                    - canceled
                    - unpaid
                    - incomplete
                    - pending
                  active:
                    type: boolean
                  applied:
                    type: boolean
  /subscription/cancel:
    post:
      tags:
      - Subscription
      summary: Cancel active subscription (defaults to cancel-at-period-end)
      description: "PURPOSE: Cancel own subscription from the billing page.\nCONCEPTS:\
        \ Subscribing.\nACTIONS: Calls Subscribing.cancel(owner=user, atPeriodEnd=true\
        \ by default).\n  Stripe is asked to cancel at period end; the returned snapshot\
        \ is\n  applied locally right away, and the subsequent\n  customer.subscription.*\
        \ webhook confirms it (idempotent merge).\nSIDE EFFECTS: Subscription stays\
        \ active until currentPeriodEnd; when\n  the period closes the webhook flips\
        \ status=\"canceled\" and\n  _hasActiveAccess returns false.\nPREREQUISITES:\
        \ Valid bearer access token. Subscription must be active\n  or trialing.\n\
        RESPONSE: { status, cancelAtPeriodEnd }\nERRORS: 400 \"no active subscription\"\
        ; 502 \"stripe error\".\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                atPeriodEnd:
                  type: boolean
                  default: true
                  description: When true (default), cancel at the end of the current
                    billing period. When false, cancel immediately.
      responses:
        '200':
          description: Cancellation applied
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - cancelAtPeriodEnd
                properties:
                  status:
                    type: string
                    enum:
                    - active
                    - trialing
                    - past_due
                    - canceled
                    - unpaid
                    - incomplete
                    - pending
                  cancelAtPeriodEnd:
                    type: boolean
  /subscription/portal:
    post:
      tags:
      - Subscription
      summary: Open Stripe Billing Portal (self-serve cancel / update card / invoices)
      description: "PURPOSE: Provide a \"manage billing\" link that hands the user\
        \ to\n  Stripe's hosted Billing Portal.\nCONCEPTS: Subscribing.\nACTIONS:\
        \ Calls Subscribing.openPortal(owner=user) → returns a one-time\n  portal\
        \ URL. Frontend must FULL-PAGE redirect to `url`.\nSIDE EFFECTS: None locally;\
        \ all updates happen on Stripe's portal\n  and propagate back via webhook.\n\
        PREREQUISITES: Valid bearer access token. The owner must have a\n  customerId\
        \ (i.e. an existing subscription).\nRESPONSE: { url }\nERRORS: 400 \"no subscription\
        \ on file\"; 502 \"stripe error\".\n"
      responses:
        '200':
          description: Portal session created
          content:
            application/json:
              schema:
                type: object
                required:
                - url
                properties:
                  url:
                    type: string
                    description: Stripe Billing Portal URL — frontend must full-page
                      redirect
  /webhooks/stripe:
    post:
      tags:
      - Webhooks
      summary: Stripe webhook ingress (system-called)
      security: []
      description: "PURPOSE: Receive Stripe lifecycle events and apply subscription\
        \ state.\nCALLED BY: Stripe's servers (NOT by the frontend). This endpoint\
        \ is\n  NEVER referenced by any app graph edge or data_requirements — it\n\
        \  is an expected \"unused endpoint\" in the app graph.\nCONCEPTS: Subscribing\
        \ (system ingest).\nACTIONS: Calls Subscribing.ingestEvent(rawBody, headers)\
        \ OPAQUELY.\n  The implementation (NOT this sync) verifies the Stripe signature\n\
        \  over the exact rawBody via the stripe util; unverified or stale\n  events\
        \ return an error without touching state. Dedupes by event id.\n  Then routes\
        \ Subscribing's own events (mode=subscription) and\n  MERGE-upserts by subscriptionId:\n\
        \    - checkout.session.completed (subscription mode only)\n    - customer.subscription.created\n\
        \    - customer.subscription.updated (also delivers renewals + cancel-at-period-end\
        \ landings)\n    - customer.subscription.deleted\n  Other Stripe products'\
        \ events and duplicates are acknowledged 200\n  (applied=false).\nRESPONSES:\n\
        \  - 200 { received: true } on success — even for irrelevant or duplicate\
        \ events\n  - 400 { error } when ingestEvent returns an error\nREQUEST BODY:\
        \ OPAQUE Stripe-signed payload. The runtime exposes\n  rawBody + headers on\
        \ /webhooks/* routes; do NOT parse the body\n  here, do NOT verify a signature\
        \ header here, and do NOT give the\n  body a JSON schema.\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Opaque Stripe webhook payload (raw bytes — do not assume
                JSON shape here)
      responses:
        '200':
          description: Event acknowledged
          content:
            application/json:
              schema:
                type: object
                required:
                - received
                properties:
                  received:
                    type: boolean
                    enum:
                    - true
        '400':
          description: Ingest error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/dashboard/recent-posts:
    get:
      tags:
      - Admin
      summary: Recent posts for the Admin Dashboard (with moderation status)
      description: "PURPOSE: Show recent posts in the admin moderation view with\n\
        \  their moderation status.\nCONCEPTS: AdminAuthenticating (gate), Posting,\
        \ Profiling, Liking, Commenting,\n  ModerationReview.\nACTIONS:\n  1. Sessioning._getUser(token)\
        \ → principal\n  2. AdminAuthenticating._isAdmin(principal) — MUST be true\
        \ (else 403)\n  3. Posting._allPosts(limit) → recent posts (includes anonymized)\n\
        \  4. For each post: ModerationReview._getLatestForTarget(\"post\", postId)\n\
        \     → resolve moderationStatus and moderationRuleViolated\n  5. For each:\
        \ Liking._countForItem(postId) + Commenting._getCommentCount(postId)\n  6.\
        \ Profiling._getProfilesByIds([post.authorId for non-null]) → authors\nSIDE\
        \ EFFECTS: None.\nPREREQUISITES: Admin session (session principal must satisfy\n\
        \  AdminAuthenticating._isAdmin).\nRESPONSE: { posts: [Post, ...] } — each\
        \ post includes moderationStatus\n  and moderationRuleViolated so the admin\
        \ can see the moderation state.\nERRORS: 401 invalid session; 403 not admin.\n"
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 20
      responses:
        '200':
          description: Recent posts
          content:
            application/json:
              schema:
                type: object
                required:
                - posts
                properties:
                  posts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Post'
        '403':
          description: Not admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/dashboard/recent-members:
    get:
      tags:
      - Admin
      summary: Recent members for the Admin Dashboard
      description: "PURPOSE: Show recently joined members in the admin view.\nCONCEPTS:\
        \ AdminAuthenticating (gate), MembershipListing.\nACTIONS:\n  1. AdminAuthenticating._isAdmin(principal)\
        \ — MUST be true (else 403)\n  2. MembershipListing._listRecentMembers(limit)\
        \ → member rows\nSIDE EFFECTS: None.\nPREREQUISITES: Admin session.\nRESPONSE:\
        \ { members: [Member, ...] } — newest joinedAt first.\nERRORS: 401 invalid\
        \ session; 403 not admin.\n"
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 20
      responses:
        '200':
          description: Recent members
          content:
            application/json:
              schema:
                type: object
                required:
                - members
                properties:
                  members:
                    type: array
                    items:
                      $ref: '#/components/schemas/Member'
        '403':
          description: Not admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/posts/{postId}:
    delete:
      tags:
      - Admin
      summary: Admin remove a post (moderation, with moderation review cleanup)
      description: "PURPOSE: Moderator removes any post for policy violations.\nCONCEPTS:\
        \ AdminAuthenticating (gate), Posting, Commenting, Liking,\n  Notifying, Feed,\
        \ ModerationReview.\nACTIONS (server-side; idempotent):\n  1. AdminAuthenticating._isAdmin(principal)\
        \ — MUST be true (else 403)\n  2. Posting.deleteByModerator(postId, moderator=adminPrincipal)\n\
        \  3. Commenting.deleteByItem(postId)\n  4. Liking.deleteByItem(postId)\n\
        \  5. Notifying.deleteByTrigger(postId)\n  6. Feed.removeItem(postId)\n  7.\
        \ ModerationReview.deleteByTarget(\"post\", postId) — drop moderation review\n\
        \  8. MediaHosting.delete(imageId, adminPrincipal) — best-effort; the\n  \
        \   image uploader is the original author, not the admin, so the\n     concept's\
        \ uploader-match check would FAIL — leave the file\n     orphaned rather than\
        \ fail the moderation.\nSIDE EFFECTS: All derived data for the post is removed,\
        \ including its\n  ModerationReview row.\nPREREQUISITES: Admin session.\n\
        RESPONSE: { ok: true }\nERRORS: 401 invalid session; 403 not admin; 404 post\
        \ not found.\n"
      parameters:
      - name: postId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Post removed
          content:
            application/json:
              schema:
                type: object
                required:
                - ok
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
        '403':
          description: Not admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/admins:
    get:
      tags:
      - Admin
      summary: List admins (for the admin management view)
      description: "PURPOSE: Show the admin management list.\nCONCEPTS: AdminAuthenticating\
        \ (gate + query).\nACTIONS: AdminAuthenticating._isAdmin(principal) (gate)\
        \ +\n  AdminAuthenticating._listAdmins() (query).\nSIDE EFFECTS: None.\nPREREQUISITES:\
        \ Admin session.\nRESPONSE: { admins: [AdminPrincipal, ...] }\nERRORS: 401\
        \ invalid session; 403 not admin.\n"
      responses:
        '200':
          description: Admins
          content:
            application/json:
              schema:
                type: object
                required:
                - admins
                properties:
                  admins:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminPrincipal'
        '403':
          description: Not admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/users/{userId}/promote:
    post:
      tags:
      - Admin
      summary: Promote a registered user to admin
      description: "PURPOSE: Grant admin role to a registered user.\nCONCEPTS: AdminAuthenticating.\n\
        ACTIONS:\n  1. AdminAuthenticating._isAdmin(principal) — MUST be true (else\
        \ 403)\n  2. AdminAuthenticating.promote(user=userId)\nSIDE EFFECTS: A \"\
        promoted\" Admin row is added for the user; _isAdmin\n  returns true for that\
        \ user from then on.\nPREREQUISITES: Admin session. The user must not already\
        \ be an admin.\nRESPONSE: { ok: true }\nERRORS: 401 invalid session; 403 not\
        \ admin;\n  400 \"user is already an admin\"; 404 user not found.\n"
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: User promoted
          content:
            application/json:
              schema:
                type: object
                required:
                - ok
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
        '400':
          description: Already admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/users/{userId}/demote:
    post:
      tags:
      - Admin
      summary: Demote a promoted admin back to regular user
      description: "PURPOSE: Revoke admin role from a promoted user.\nCONCEPTS: AdminAuthenticating.\n\
        ACTIONS:\n  1. AdminAuthenticating._isAdmin(principal) — MUST be true (else\
        \ 403)\n  2. AdminAuthenticating.demote(user=userId)\nSIDE EFFECTS: The promoted\
        \ Admin row is removed. The root admin\n  (subject == root) CANNOT be demoted\
        \ — the concept enforces this so\n  the app can never lose all admins.\nPREREQUISITES:\
        \ Admin session. The target must be a \"promoted\" admin.\nRESPONSE: { ok:\
        \ true }\nERRORS: 401 invalid session; 403 not admin;\n  400 \"cannot demote\
        \ root admin\"; 400 \"user is not a promoted admin\".\n"
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: User demoted
          content:
            application/json:
              schema:
                type: object
                required:
                - ok
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
        '400':
          description: Cannot demote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/moderation/{reviewId}/approve:
    post:
      tags:
      - Moderation
      summary: Admin approve a flagged item (return it to feeds)
      description: "PURPOSE: The admin approves a flagged post or comment, returning\
        \ it to\n  feeds and public visibility.\nCONCEPTS: AdminAuthenticating (gate),\
        \ ModerationReview, Feed, Following,\n  Posting (for content lookup), Commenting\
        \ (for content lookup).\nACTIONS:\n  1. Sessioning._getUser(token) → principal\n\
        \  2. AdminAuthenticating._isAdmin(principal) — MUST be true (else 403)\n\
        \  3. ModerationReview._getReview(reviewId) → review (must exist, must have\n\
        \     status=\"flagged\" — else 400)\n  4. ModerationReview.adminApprove(review=reviewId,\
        \ admin=principal)\n     → sets status=\"admin_approved\", adminDecision=\"\
        approved\"\n  5. If review.targetType is \"post\":\n     a. Posting._getPost(review.targetId)\
        \ → post content\n     b. Following._followers(post.authorId) → list of follower\
        \ userIds\n     c. For each follower: Feed.fanoutEntry([follower], post.authorId,\n\
        \        review.targetId, post.createdAt, {caption, imageUrl, supportersOnly,\
        \ authorId})\n        — re-adds the post to all followers' Home Feeds\n  6.\
        \ If review.targetType is \"comment\": no feed action needed (comments are\n\
        \     fetched per-post, not stored in feeds)\nSIDE EFFECTS: Review status\
        \ → \"admin_approved\". If the item is a post, it is\n  re-fanned-out to all\
        \ followers' feeds and becomes visible. The item is\n  removed from the moderation\
        \ queue (status is no longer \"flagged\").\nPREREQUISITES: Admin session.\
        \ Review must exist and have status=\"flagged\".\nRESPONSE: { ok: true }\n\
        ERRORS: 401 invalid session; 403 not admin;\n  404 \"review not found\"; 400\
        \ \"review is not flagged\".\n"
      parameters:
      - name: reviewId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Item approved
          content:
            application/json:
              schema:
                type: object
                required:
                - ok
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
        '400':
          description: Review is not flagged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Review not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/moderation/queue:
    get:
      tags:
      - Moderation
      summary: Admin moderation queue — all flagged items with AI rationale
      description: "PURPOSE: List all posts and comments flagged by the automated\
        \ AI moderation\n  system, with the AI's written rationale, violated rule,\
        \ and content preview.\n  Powers the Admin Moderation Queue page.\nCONCEPTS:\
        \ AdminAuthenticating (gate), ModerationReview, Posting, Commenting, Profiling.\n\
        ACTIONS:\n  1. Sessioning._getUser(token) → principal\n  2. AdminAuthenticating._isAdmin(principal)\
        \ — MUST be true (else 403)\n  3. ModerationReview._listFlagged(limit, skip)\
        \ → all reviews with status=\"flagged\"\n  4. For each review:\n     a. If\
        \ targetType is \"post\": Posting._getPost(targetId) → post content\n    \
        \    (caption, imageUrl, supportersOnly)\n     b. If targetType is \"comment\"\
        : Commenting._getComment(targetId) → comment text\n  5. Collect all authorIds;\
        \ Profiling._getProfilesByIds(authorIds) → author profiles\n  6. Assemble\
        \ each item with: reviewId, targetType, targetId, author (hydrated),\n   \
        \  content (post content or comment text), ruleViolated, rationale, createdAt\n\
        SIDE EFFECTS: None.\nPREREQUISITES: Admin session (session principal must\
        \ satisfy\n  AdminAuthenticating._isAdmin).\nRESPONSE: { items: [ModerationQueueItem,\
        \ ...] }\n  — each item has the full content preview, author info, violated\
        \ rule,\n  and AI's written rationale.\nERRORS: 401 invalid session; 403 not\
        \ admin.\n"
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: skip
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: Flagged moderation items
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ModerationQueueItem'
        '401':
          description: Invalid session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/moderation/{reviewId}/remove:
    post:
      tags:
      - Moderation
      summary: Admin permanently remove a flagged item
      description: "PURPOSE: The admin permanently removes a flagged post or comment\
        \ from the\n  platform. The underlying content is hard-deleted with full cascade.\n\
        CONCEPTS: AdminAuthenticating (gate), ModerationReview, Posting, Commenting,\n\
        \  Liking, Notifying, Feed.\nACTIONS:\n  1. Sessioning._getUser(token) → principal\n\
        \  2. AdminAuthenticating._isAdmin(principal) — MUST be true (else 403)\n\
        \  3. ModerationReview._getReview(reviewId) → review (must exist; status must\n\
        \     be \"flagged\", \"approved\", or \"admin_approved\" — else 400)\n  4.\
        \ ModerationReview.adminRemove(review=reviewId, admin=principal)\n     → sets\
        \ status=\"admin_removed\", adminDecision=\"removed\"\n  5. If review.targetType\
        \ is \"post\":\n     a. Posting.deleteByModerator(review.targetId, moderator=principal)\n\
        \     b. Commenting.deleteByItem(review.targetId)\n     c. Liking.deleteByItem(review.targetId)\n\
        \     d. Notifying.deleteByTrigger(review.targetId)\n     e. Feed.removeItem(review.targetId)\n\
        \     f. ModerationReview.deleteByTarget(\"post\", review.targetId) — drop\
        \ the review row\n  6. If review.targetType is \"comment\":\n     a. Commenting.deleteByModerator(review.targetId,\
        \ moderator=principal)\n     b. ModerationReview.deleteByTarget(\"comment\"\
        , review.targetId) — drop the review row\nSIDE EFFECTS: Full cascade deletion\
        \ of the content and all derived data.\n  The item is removed from the moderation\
        \ queue (review row deleted).\nPREREQUISITES: Admin session. Review must exist\
        \ and have status \"flagged\",\n  \"approved\", or \"admin_approved\".\nRESPONSE:\
        \ { ok: true }\nERRORS: 401 invalid session; 403 not admin;\n  404 \"review\
        \ not found\"; 400 \"review cannot be removed in current state\".\n"
      parameters:
      - name: reviewId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Item removed
          content:
            application/json:
              schema:
                type: object
                required:
                - ok
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
        '400':
          description: Review cannot be removed in current state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Review not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
