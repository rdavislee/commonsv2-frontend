openapi: 3.0.0
info:
  title: Commons API
  description: 'Image-sharing community app API. Users register, create profiles,
    post photos

    with captions, follow each other, like and comment, and browse a Home Feed

    (followed users) and Discover Feed (all users). A paid monthly supporter

    tier unlocks supporters-only content via Stripe Checkout. Admins sign in

    with environment-configured credentials and moderate posts.

    '
  version: 1.0.0
servers:
- url: /
  description: Same-origin
tags:
- name: Authentication
- name: Admin
- name: Profile
- name: Media
- name: Posts
- name: Comments
- name: Likes
- name: Follows
- name: Feed
- name: Notifications
- name: Subscription
- name: Webhooks
security:
- bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Subscription:
      type: object
      required:
      - _id
      - status
      - createdAt
      - updatedAt
      properties:
        _id:
          type: string
        userId:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - active
          - trialing
          - past_due
          - canceled
          - unpaid
          - incomplete
          - pending
        planId:
          type: string
          nullable: true
        currentPeriodEnd:
          type: string
          format: date-time
          nullable: true
        cancelAtPeriodEnd:
          type: boolean
        startedAt:
          type: string
          format: date-time
          nullable: true
        endedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Media:
      type: object
      required:
      - _id
      - url
      - mimeType
      - size
      - fileName
      - createdAt
      properties:
        _id:
          type: string
        url:
          type: string
          description: Canonical URL — use directly as <img src> or bioImageUrl/imageUrl
        mimeType:
          type: string
        size:
          type: integer
          minimum: 0
        fileName:
          type: string
        createdAt:
          type: string
          format: date-time
    Post:
      type: object
      required:
      - _id
      - authorId
      - author
      - content
      - isLocked
      - isLiked
      - isOwner
      - likeCount
      - commentCount
      - moderationStatus
      - moderationRuleViolated
      - createdAt
      - updatedAt
      properties:
        _id:
          type: string
        authorId:
          type: string
          nullable: true
        author:
          $ref: '#/components/schemas/AuthorSummary'
        content:
          type: object
          required:
          - caption
          - imageUrl
          - supportersOnly
          properties:
            caption:
              type: string
            imageUrl:
              type: string
              nullable: true
              description: null when post is locked for non-supporters
            supportersOnly:
              type: boolean
        type:
          type: string
          enum:
          - image
        isLocked:
          type: boolean
          description: true when supportersOnly is true and the viewer does NOT have
            an active subscription (and is not the post author)
        isLiked:
          type: boolean
          description: true when the current viewer has liked this post
        isOwner:
          type: boolean
          description: true when the current viewer is the author
        likeCount:
          type: integer
          minimum: 0
        commentCount:
          type: integer
          minimum: 0
        moderationStatus:
          type: string
          enum:
          - pending
          - approved
          - flagged
          - admin_approved
          - admin_removed
          description: Moderation state resolved from ModerationReview._getLatestForTarget("post",
            postId). "approved" or "admin_approved" means visible in feeds; "flagged"
            or "pending" means hidden from non-authors; "admin_removed" means inaccessible.
        moderationRuleViolated:
          type: string
          nullable: true
          enum:
          - harassment
          - hate
          - sexually_explicit
          - spam
          description: Which community guideline was violated, if moderationStatus
            is "flagged"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AdminPrincipal:
      type: object
      required:
      - subject
      - source
      - createdAt
      properties:
        subject:
          type: string
        source:
          type: string
          enum:
          - root
          - promoted
        createdAt:
          type: string
          format: date-time
    ModerationQueueItem:
      type: object
      required:
      - reviewId
      - targetType
      - targetId
      - authorId
      - author
      - status
      - ruleViolated
      - rationale
      - content
      - createdAt
      - updatedAt
      properties:
        reviewId:
          type: string
        targetType:
          type: string
          enum:
          - post
          - comment
        targetId:
          type: string
        authorId:
          type: string
          nullable: true
        author:
          $ref: '#/components/schemas/AuthorSummary'
        status:
          type: string
          enum:
          - pending
          - approved
          - flagged
          - admin_approved
          - admin_removed
        ruleViolated:
          type: string
          nullable: true
          enum:
          - harassment
          - hate
          - sexually_explicit
          - spam
        rationale:
          type: string
          description: AI's written explanation of its moderation decision
        content:
          type: object
          description: 'For posts: {caption, imageUrl, supportersOnly}. For comments:
            {text}.'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Member:
      type: object
      required:
      - userId
      - displayName
      - avatarUrl
      - joinedAt
      - followerCount
      properties:
        userId:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: string
        joinedAt:
          type: string
          format: date-time
        followerCount:
          type: integer
          minimum: 0
    Profile:
      type: object
      required:
      - _id
      - userId
      - username
      - name
      - bio
      - bioImageUrl
      - createdAt
      - updatedAt
      properties:
        _id:
          type: string
        userId:
          type: string
        username:
          type: string
        name:
          type: string
        bio:
          type: string
        bioImageUrl:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Notification:
      type: object
      required:
      - _id
      - recipient
      - actorId
      - type
      - read
      - createdAt
      properties:
        _id:
          type: string
        recipient:
          type: string
        actorId:
          type: string
        actor:
          type: object
          nullable: true
          required:
          - _id
          - username
          - name
          properties:
            _id:
              type: string
            username:
              type: string
            name:
              type: string
            bioImageUrl:
              type: string
        type:
          type: string
          enum:
          - like
          - comment
          - follow
        targetPostId:
          type: string
          nullable: true
          description: set for like/comment notifications; null for follow notifications
        targetPost:
          type: object
          nullable: true
          description: Hydrated target post (caption + image only) for like/comment
            notifications. imageUrl is null when the post is locked for the viewer.
            null for follow notifications.
          required:
          - _id
          properties:
            _id:
              type: string
            caption:
              type: string
            imageUrl:
              type: string
              nullable: true
        content:
          type: object
          additionalProperties: true
          description: Original Notifying.content payload (kept for extensibility)
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: string
    AuthorSummary:
      type: object
      nullable: true
      description: Hydrated author display data. null when the post/comment is anonymized.
      required:
      - _id
      - username
      - name
      properties:
        _id:
          type: string
        username:
          type: string
        name:
          type: string
        bioImageUrl:
          type: string
    Like:
      type: object
      required:
      - _id
      - item
      - user
      - createdAt
      properties:
        _id:
          type: string
        item:
          type: string
        user:
          type: string
        createdAt:
          type: string
          format: date-time
    Comment:
      type: object
      required:
      - _id
      - item
      - authorId
      - author
      - content
      - isOwner
      - moderationStatus
      - moderationRuleViolated
      - createdAt
      - updatedAt
      properties:
        _id:
          type: string
        item:
          type: string
          description: The post ID this comment belongs to
        authorId:
          type: string
          nullable: true
        author:
          $ref: '#/components/schemas/AuthorSummary'
        content:
          type: string
        isOwner:
          type: boolean
        moderationStatus:
          type: string
          enum:
          - pending
          - approved
          - flagged
          - admin_approved
          - admin_removed
          description: Moderation state resolved from ModerationReview._getLatestForTarget("comment",
            commentId)
        moderationRuleViolated:
          type: string
          nullable: true
          enum:
          - harassment
          - hate
          - sexually_explicit
          - spam
          description: Which community guideline was violated, if moderationStatus
            is "flagged"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Me:
      type: object
      required:
      - userId
      - email
      - isAdmin
      properties:
        userId:
          type: string
        email:
          type: string
          format: email
        isAdmin:
          type: boolean
          description: true when the current session's principal satisfies AdminAuthenticating._isAdmin
    User:
      type: object
      required:
      - _id
      - email
      - createdAt
      - updatedAt
      properties:
        _id:
          type: string
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Follow:
      type: object
      required:
      - _id
      - follower
      - followee
      - createdAt
      properties:
        _id:
          type: string
        follower:
          type: string
        followee:
          type: string
        createdAt:
          type: string
          format: date-time
paths:
  /auth/register:
    post:
      tags:
      - Authentication
      summary: Register a new user account (auto-issues session tokens)
      security: []
      description: "PURPOSE: Create a new user account and immediately establish\n\
        \ a JWT session so the next request (POST /me/profile) has a valid bearer\n\
        \ token. Without this, the onboarding sequence in the app graph\n (register\
        \ → create_profile) would 401 on the profile submit.\nCONCEPTS: Authenticating,\
        \ Sessioning.\nACTIONS: Calls Authenticating.register(email, password)\n \
        \ then Sessioning.create(user).\nSIDE EFFECTS: New active Session row with\
        \ refresh-token jti\n  and access-token jti.\nPREREQUISITES: Public (no auth\
        \ required). Email must not already exist.\nRESPONSE: { user: User, accessToken,\
        \ refreshToken }\nERRORS: 400 \"email already registered\"; 400 \"invalid\
        \ email format\";\n  400 \"password must be 8–128 characters\".\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
      responses:
        '201':
          description: User created and session established
          content:
            application/json:
              schema:
                type: object
                required:
                - user
                - accessToken
                - refreshToken
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/login:
    post:
      tags:
      - Authentication
      summary: Log in an existing user
      security: []
      description: 'PURPOSE: Authenticate and issue a JWT session pair.

        CONCEPTS: Authenticating, Sessioning.

        ACTIONS: Calls Authenticating.login(email, password) then Sessioning.create(user).

        SIDE EFFECTS: New active Session row with refresh-token jti and access-token
        jti.

        PREREQUISITES: Public.

        RESPONSE: { user: User, accessToken, refreshToken }

        ERRORS: 401 "invalid credentials" (uniform — never reveals whether the email
        exists).

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  minLength: 1
                  maxLength: 128
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                required:
                - user
                - accessToken
                - refreshToken
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/refresh:
    post:
      tags:
      - Authentication
      summary: Refresh session tokens
      security: []
      description: "PURPOSE: Exchange a valid refresh token for a new access/refresh\
        \ pair.\nCONCEPTS: Sessioning.\nACTIONS: Calls Sessioning.refresh(refreshToken).\n\
        SIDE EFFECTS: Old session marked status=\"revoked\"; new active session created.\n\
        PREREQUISITES: Refresh token must be signature-valid, unexpired, type=\"refresh\"\
        ,\n  and the associated session must be status=\"active\".\nRESPONSE: { accessToken,\
        \ refreshToken }\nERRORS: 401 \"invalid or expired refresh token\".\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Tokens refreshed
          content:
            application/json:
              schema:
                type: object
                required:
                - accessToken
                - refreshToken
                properties:
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
        '401':
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/logout:
    post:
      tags:
      - Authentication
      summary: End the current session
      description: "PURPOSE: Revoke the current access-token session.\nCONCEPTS: Sessioning.\n\
        ACTIONS: Calls Sessioning.delete(accessToken).\nSIDE EFFECTS: Session marked\
        \ status=\"revoked\"; refresh token invalidated.\nPREREQUISITES: Valid bearer\
        \ access token.\nRESPONSE: { ok: true }\nERRORS: 401 invalid session (likely\
        \ already logged out — frontend should\n  still redirect to login).\n"
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                required:
                - ok
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
  /auth/reset-password:
    post:
      tags:
      - Authentication
      summary: Reset password with current credentials
      security: []
      description: "PURPOSE: Change own password by providing old and new.\nCONCEPTS:\
        \ Authenticating.\nACTIONS: Calls Authenticating.resetPassword(email, oldPassword,\
        \ newPassword).\nSIDE EFFECTS: Password hash updated. Existing sessions are\
        \ NOT invalidated.\nPREREQUISITES: None (public). User must know the current\
        \ password.\nRESPONSE: { ok: true }\nERRORS: 401 \"invalid old password\"\
        ; 404 \"user not found\";\n  400 \"password must be 8–128 characters\".\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - oldPassword
              - newPassword
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                oldPassword:
                  type: string
                  minLength: 1
                  maxLength: 128
                newPassword:
                  type: string
                  minLength: 8
                  maxLength: 128
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                type: object
                required:
                - ok
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
  /admin/login:
    post:
      tags:
      - Admin
      summary: Admin login with environment-configured credentials
      security: []
      description: "PURPOSE: Authenticate the site operator using ADMIN_EMAIL/ADMIN_PASSWORD\
        \ env vars.\nCONCEPTS: AdminAuthenticating, Sessioning.\nACTIONS: Calls AdminAuthenticating.login(email,\
        \ password) then Sessioning.create(admin).\nSIDE EFFECTS: New session bound\
        \ to the admin principal id.\nPREREQUISITES: Public. Credentials are verified\
        \ constant-time against\n  the env config; in mock mode ANY submitted credentials\
        \ succeed; if env\n  not configured in LIVE mode EVERY login fails.\nRESPONSE:\
        \ { admin: AdminPrincipal, accessToken, refreshToken }\nERRORS: 401 \"invalid\
        \ credentials\"; 503 \"admin not configured\".\nNOTE: The plan's form field\
        \ is \"username\" — it maps to the concept's\n  `email` parameter (admin is\
        \ identified by email in the env).\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  maxLength: 254
                password:
                  type: string
                  minLength: 1
                  maxLength: 128
      responses:
        '200':
          description: Admin login successful
          content:
            application/json:
              schema:
                type: object
                required:
                - admin
                - accessToken
                - refreshToken
                properties:
                  admin:
                    $ref: '#/components/schemas/AdminPrincipal'
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Admin not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /me/profile:
    get:
      tags:
      - Profile
      summary: Get own profile with follower counts and subscription badge
      description: "PURPOSE: Retrieve the current user's own profile.\nCONCEPTS: Profiling,\
        \ Following, Subscribing.\nACTIONS: Calls Profiling._getProfile(user), Following._getFollowerCount(user),\n\
        \  Following._getFollowingCount(user), Subscribing._hasActiveAccess(user).\n\
        SIDE EFFECTS: None.\nPREREQUISITES: Valid bearer access token.\nRESPONSE:\
        \ { profile, followerCount, followingCount, hasActiveSubscription }.\nERRORS:\
        \ 404 with { error } when profile has not been created yet\n  (expected for\
        \ users who haven't completed onboarding — frontend should\n  NOT treat this\
        \ as an auth failure and logout).\n"
      responses:
        '200':
          description: Profile found
          content:
            application/json:
              schema:
                type: object
                required:
                - profile
                - followerCount
                - followingCount
                - hasActiveSubscription
                properties:
                  profile:
                    $ref: '#/components/schemas/Profile'
                  followerCount:
                    type: integer
                    minimum: 0
                  followingCount:
                    type: integer
                    minimum: 0
                  hasActiveSubscription:
                    type: boolean
        '404':
          description: Profile not yet created (new user before onboarding completes)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
      - Profile
      summary: Create own profile (onboarding step after registration)
      description: "PURPOSE: Onboarding step — create the public profile.\nCONCEPTS:\
        \ Profiling, MembershipListing (side-effect sync).\nACTIONS: Calls Profiling.createProfile(user,\
        \ username, name, bio, bioImageUrl).\nSIDE EFFECTS: Sync calls MembershipListing.record(user,\
        \ name, bioImageUrl,\n  now, 0) so the Admin Dashboard \"Recent members\"\
        \ list includes this user.\nPREREQUISITES: Valid bearer access token. bioImageUrl\
        \ must be a URL\n  returned from POST /media/upload (or empty string for no\
        \ avatar).\nRESPONSE: { profile: Profile }\nERRORS: 400 \"username taken\"\
        ; 400 \"username must match pattern\";\n  400 \"name required\"; 400 \"username\
        \ required\".\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - username
              - name
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 30
                  pattern: ^[a-zA-Z0-9_-]+$
                  description: Unique profile handle.
                name:
                  type: string
                  minLength: 1
                  maxLength: 60
                bio:
                  type: string
                  maxLength: 500
                bioImageUrl:
                  type: string
                  maxLength: 2048
                  description: Avatar URL from POST /media/upload, or empty string
      responses:
        '201':
          description: Profile created
          content:
            application/json:
              schema:
                type: object
                required:
                - profile
                properties:
                  profile:
                    $ref: '#/components/schemas/Profile'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags:
      - Profile
      summary: Update own profile
      description: "PURPOSE: Update display name, bio, avatar, or username.\nCONCEPTS:\
        \ Profiling, MembershipListing (side-effect sync).\nACTIONS: Calls Profiling.updateProfile(user,\
        \ username?, name?, bio?, bioImageUrl?).\nSIDE EFFECTS: If name or bioImageUrl\
        \ changes, sync calls\n  MembershipListing.updateFromProfile(user, name, bioImageUrl)\
        \ so the\n  admin dashboard reflects the change.\nPREREQUISITES: Valid bearer\
        \ access token. bioImageUrl must be a URL\n  returned from POST /media/upload.\n\
        RESPONSE: { profile: Profile }\nERRORS: 400 \"username taken\"; 400 \"username\
        \ must match pattern\";\n  400 \"at least one field required\"; 404 \"profile\
        \ not found\".\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 30
                  pattern: ^[a-zA-Z0-9_-]+$
                name:
                  type: string
                  minLength: 1
                  maxLength: 60
                bio:
                  type: string
                  maxLength: 500
                bioImageUrl:
                  type: string
                  maxLength: 2048
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                type: object
                required:
                - profile
                properties:
                  profile:
                    $ref: '#/components/schemas/Profile'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Profile not yet created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /me:
    get:
      tags:
      - Profile
      summary: Get the current session's principal, email, and admin flag
      description: "PURPOSE: Return the current session's principal, email, and\n\
        \ admin flag. Single endpoint that lets the frontend decide admin-only\n UI\
        \ affordances (e.g. Post Detail's \"Admin Remove Post\" button via\n the graph\
        \ edge with condition isAdmin) AND renders the Settings page's\n \"Account\
        \ information (email)\" field without depending on the Profile\n schema (which\
        \ carries userId, not email).\nCONCEPTS: Authenticating, AdminAuthenticating.\n\
        ACTIONS:\n  1. Sessioning._getUser(accessToken) → user (resolved session principal)\n\
        \  2. Authenticating._getUserById(user) → user, email\n  3. AdminAuthenticating._isAdmin(user)\
        \ → isAdmin\nSIDE EFFECTS: None.\nPREREQUISITES: Valid bearer access token.\n\
        RESPONSE: { userId, email, isAdmin }\nERRORS: 401 invalid session.\n"
      responses:
        '200':
          description: Current session info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          description: Invalid session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
      - Profile
      summary: Delete own account (full cascade)
      description: "PURPOSE: Permanently delete own account and all owned data.\n\
        CONCEPTS: Posting, Commenting, Liking, Following, Notifying, Profiling,\n\
        \  Authenticating, Sessioning, Subscribing, Feed, MembershipListing,\n  ModerationReview,\
        \ AIModeration.\nACTIONS (server-side, in order):\n  1. Posting.anonymizeByAuthor(user)\
        \ — preserves other users' comment/like history\n  2. Commenting.anonymizeByAuthor(user)\
        \ — preserves content on others' posts\n  3. Liking.deleteByUser(user) — hard-delete\
        \ user's likes\n  4. Following.deleteByFollower(user) + Following.deleteByFollowed(user)\
        \ — clean both sides\n  5. Notifying.deleteByRecipient(user) — drop notifications\
        \ targeted at user\n  6. ModerationReview.deleteByAuthor(user) — remove all\
        \ moderation reviews for user's content\n  7. AIModeration.deleteAllPoliciesForOwner(user)\
        \ — remove any policies owned by user\n  8. Profiling.deleteProfile(user)\
        \ — drop profile\n  9. MembershipListing.removeByUser(user) — drop member\
        \ row\n  10. Subscribing.deleteByOwner(user) — best-effort cancel any active\
        \ sub at Stripe + drop local rows\n  11. Feed.deleteByViewer(user) + Feed.deleteBySourceForAll(user)\
        \ — wipe own feed + drop source from others\n  12. Authenticating.deleteAuthenticationByUser(user)\
        \ — drop auth row\n  13. Sessioning.deleteByUser(user) — revoke all sessions\n\
        SIDE EFFECTS: Posts and comments authored by this user are ANONYMIZED\n  (author\
        \ field cleared to null), preserving content — including their images —\n\
        \  visible to other users; likes/follows/sessions/auth are hard-deleted.\n\
        \  Moderation reviews for the user's content are removed.\n  MediaHosting.deleteByUploader\
        \ is intentionally NOT called so that image URLs\n  referenced by anonymized\
        \ posts remain accessible to other users.\nPREREQUISITES: Valid bearer access\
        \ token.\nRESPONSE: { ok: true } (frontend should drop tokens and redirect\
        \ to /login)\nERRORS: 401 invalid session. Concept-level deleteBy* actions\
        \ are\n  idempotent, so cascade retries are safe.\n"
      responses:
        '200':
          description: Account deleted
          content:
            application/json:
              schema:
                type: object
                required:
                - ok
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
  /profiles/{userId}:
    get:
      tags:
      - Profile
      summary: Get another user's public profile
      description: "PURPOSE: View another user's profile with post grid and follower\
        \ counts.\nCONCEPTS: Profiling, Following, Posting, Subscribing, Liking, Commenting,\n\
        \  ModerationReview (content-visibility gate).\nACTIONS: Calls Profiling._getProfile(userId),\
        \ Following._getFollowerCount(userId),\n  Following._getFollowingCount(userId),\
        \ Following._isFollowing(viewer, userId),\n  Posting._getPostsByAuthor(userId,\
        \ limit), Subscribing._hasActiveAccess(viewer);\n  then per post: ModerationReview._getLatestForTarget(\"\
        post\", postId) → moderation\n  status. EXCLUDE posts whose moderationStatus\
        \ is \"pending\", \"flagged\", or\n  \"admin_removed\" — only \"approved\"\
        \ and \"admin_approved\" posts are visible to\n  non-authors. (When viewer\
        \ IS the author, all statuses are shown — but this\n  endpoint is for viewing\
        \ OTHER users' profiles; own profile uses GET /me/profile +\n  GET /me/posts.)\
        \ Then per visible post: Liking._countForItem and\n  Commenting._getCommentCount,\
        \ with Liking._likedAmong([ids], viewer) for isLiked.\nSIDE EFFECTS: None.\n\
        PREREQUISITES: Valid bearer access token.\nRESPONSE: { profile, followerCount,\
        \ followingCount, isFollowing, posts }.\n  posts are paginated and respect\
        \ supporters-only gating for non-supporters.\n  Only moderation-approved posts\
        \ are included.\nERRORS: 404 \"user not found\" when no profile exists for\
        \ the userId.\n"
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 30
      responses:
        '200':
          description: Profile found
          content:
            application/json:
              schema:
                type: object
                required:
                - profile
                - followerCount
                - followingCount
                - isFollowing
                - posts
                properties:
                  profile:
                    $ref: '#/components/schemas/Profile'
                  followerCount:
                    type: integer
                    minimum: 0
                  followingCount:
                    type: integer
                    minimum: 0
                  isFollowing:
                    type: boolean
                  posts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Post'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /profiles/by-username/{username}:
