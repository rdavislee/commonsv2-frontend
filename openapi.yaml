      description: "PURPOSE: Remove own comment and its moderation review.\nCONCEPTS:\
        \ Commenting, ModerationReview.\nACTIONS:\n  1. Commenting._getComment(commentId)\
        \ → verify author == user (else 403)\n  2. Commenting.deleteComment(commentId,\
        \ author=user)\n  3. ModerationReview.deleteByTarget(\"comment\", commentId)\
        \ — drop moderation review\nSIDE EFFECTS: Comment row and its ModerationReview\
        \ row removed.\nPREREQUISITES: Valid bearer access token. Must be the comment\
        \ author.\nRESPONSE: { ok: true }\nERRORS: 403 \"not your comment\"; 404 \"\
        comment not found\".\n"
      parameters:
      - name: commentId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Comment deleted
          content:
            application/json:
              schema:
                type: object
                required:
                - ok
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
        '403':
          description: Not your comment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Comment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /posts/{postId}/like:
    post:
      tags:
      - Likes
      summary: Like a post
      description: "PURPOSE: Record a like and notify the post author.\nCONCEPTS:\
        \ Liking, Notifying, Posting (for author lookup).\nACTIONS:\n  1. Posting._getPost(postId)\
        \ → resolve post.authorId (skip notify if user likes own post)\n  2. Liking.like(item=postId,\
        \ user=user)\n  3. If author != user: Notifying.notify(recipient=post.authorId,\
        \ trigger=postId,\n     content={type:\"like\", actorId:user}, type=\"like\"\
        )\n  4. Liking._countForItem(postId) → likeCount for response\nSIDE EFFECTS:\
        \ Like stored on (post,user). Author gets a notification\n  (only when the\
        \ liker is someone else).\nPREREQUISITES: Valid bearer access token.\nRESPONSE:\
        \ { like: Like, likeCount, isLiked: true }\nERRORS: 400 \"already liked\"\
        ; 404 \"post not found\".\n"
      parameters:
      - name: postId
        in: path
        required: true
        schema:
