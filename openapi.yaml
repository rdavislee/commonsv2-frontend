      responses:
        '200':
          description: Post liked
          content:
            application/json:
              schema:
                type: object
                required:
                - like
                - likeCount
                - isLiked
                properties:
                  like:
                    $ref: '#/components/schemas/Like'
                  likeCount:
                    type: integer
                    minimum: 0
                  isLiked:
                    type: boolean
                    enum:
                    - true
        '400':
          description: Already liked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
      - Likes
      summary: Unlike a post
      description: "PURPOSE: Remove a like.\nCONCEPTS: Liking.\nACTIONS:\n  1. Liking.unlike(item=postId,\
        \ user=user)\n  2. Liking._countForItem(postId) → likeCount for response\n\
        SIDE EFFECTS: Like removed. The notification created at like-time is\n  intentionally\
        \ NOT removed (per plan — keeps an audit trail).\nPREREQUISITES: Valid bearer\
        \ access token.\nRESPONSE: { likeCount, isLiked: false }\nERRORS: 400 \"not\
        \ liked\"; 404 \"post not found\".\n"
      parameters:
      - name: postId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Post unliked
          content:
            application/json:
              schema:
                type: object
                required:
                - likeCount
                - isLiked
                properties:
                  likeCount:
                    type: integer
                    minimum: 0
                  isLiked:
                    type: boolean
