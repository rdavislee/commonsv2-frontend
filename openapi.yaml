  /users/{userId}/follow:
    post:
      tags:
      - Follows
      summary: Follow another user (backfill only approved posts to feed)
      description: "PURPOSE: Create a follow edge, backfill own feed with the followed\n\
        \  user's APPROVED posts, notify followed user.\nCONCEPTS: Following, Notifying,\
        \ Feed (backfill side-effect), Posting,\n  ModerationReview (content-visibility\
        \ gate — only approved posts are backfilled).\nACTIONS:\n  1. Following.follow(follower=user,\
        \ followed=userId)\n  2. Notifying.notify(recipient=userId, trigger=user,\
        \ content={type:\"follow\", actorId:user}, type=\"follow\")\n  3. Posting._getPostsByAuthor(userId,\
        \ 50) → recent posts of the followed user\n  4. For each post: ModerationReview._getLatestForTarget(\"\
        post\", postId)\n     → only backfill posts whose moderationStatus is \"approved\"\
        \ or \"admin_approved\"\n  5. For each approved post: Feed.backfillFromSource(viewer=user,\
        \ source=userId,\n     items=[{item:postId, createdAt, payload}]) — idempotent\n\
        SIDE EFFECTS: Follow edge stored; followed user notified; user's Home\n  Feed\
        \ is backfilled with the followed user's recent APPROVED posts only.\n  Flagged\
        \ or pending posts are NOT backfilled.\nPREREQUISITES: Valid bearer access\
        \ token. userId must differ from the\n  caller (concept enforces follower\
        \ != followed).\nRESPONSE: { follow: Follow, isFollowing: true }\nERRORS:\
        \ 400 \"cannot follow yourself\"; 400 \"already following\";\n  404 \"user\
        \ not found\".\n"
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Followed
          content:
            application/json:
              schema:
                type: object
                required:
                - follow
                - isFollowing
                properties:
                  follow:
                    $ref: '#/components/schemas/Follow'
                  isFollowing:
                    type: boolean
                    enum:
                    - true
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
      - Follows
      summary: Unfollow another user
      description: "PURPOSE: Remove follow edge and clean own feed.\nCONCEPTS: Following,\
        \ Feed.\nACTIONS:\n  1. Following.unfollow(follower=user, followed=userId)\n\
        \  2. Feed.removeBySource(viewer=user, source=userId) — removes every\n  \
        \   entry that user received from userId\nSIDE EFFECTS: Follow edge removed;\
        \ user's Home Feed no longer shows\n  posts from this source. No notification\
        \ is sent on unfollow.\nPREREQUISITES: Valid bearer access token.\nRESPONSE:\
        \ { isFollowing: false }\nERRORS: 400 \"not following\".\n"
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Unfollowed
          content:
            application/json:
              schema:
                type: object
                required:
                - isFollowing
                properties:
                  isFollowing:
                    type: boolean
                    enum:
                    - false
        '400':
          description: Not following
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
